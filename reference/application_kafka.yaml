server:
  port: 9800

app:
  kafka:
    topic: datafirewall.logs
    audit-topic: datafirewall.audit
    admin:
      fail-fast: true
    properties:
      request.timeout.ms: 10000
      default.api.timeout.ms: 15000
  journal:
    audit-table: dq_audit.datafirewall_flink_log
    schema: datafirewall
    table: datafirewall_journal
    partition-cron: "0 0 0 * * *"
    create-days-ahead: 3
    cleanup-period: 360

spring:
  application:
    name: datafirewall-kafka
    version: ${APP_VERSION:0.0.1}
    project-name: MKD

  datasource:
    url: ${DATASOURCE_DB_URL:localhost:5432}
    username: ${DATASOURCE_DB_USER:postgres}
    password: ${DATASOURCE_DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
    defaultSchema: datafirewall
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool

  kafka:
    bootstrap-servers: localhost:9092
    # ssl:
    #   bundle: kafka-client

    consumer:
      group-id: dfw-rules-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: manual_immediate

    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME:kafka}"
        password="${KAFKA_PASSWORD:kafka}";

    # properties:
    #   security.protocol: SASL_SSL
    #   sasl.mechanism: SCRAM-SHA-512
    #   sasl.jaas.config: >
    #     org.apache.kafka.common.security.scram.ScramLoginModule required
    #     username="${KAFKA_USERNAME}"
    #     password="${KAFKA_PASSWORD}";

    #   ssl.truststore.location: ${APP_PATH}/certs/truststore.p12
    #   ssl.truststore.password: ${TRUST_STORE_PASSWORD}
    #   ssl.truststore.type: PKCS12

    #   ssl.keystore.location: ${APP_PATH}/certs/keystore.p12
    #   ssl.keystore.password: ${KEY_STORE_PASSWORD}
    #   ssl.keystore.type: PKCS12

  flyway:
    schemas: df_meta
    enabled: false
    locations: classpath:db/migration
    url: ${FLYWAY_DB_URL}
    user: ${FLYWAY_DB_USER}
    password: ${FLYWAY_DB_PASSWORD}

logs-database:
  enabled: true
  task-create-partition: 0 0 0 * * ?
  url: ${LOGS_DB_URL:localhost:5432}
  username: ${LOGS_DB_USER:postgres}
  password: ${LOGS_DB_PASSWORD:postgres}
  driverClassName: org.postgresql.Driver
  table: "dq_audit.datafirewall_kafka_log"

clean-database-logs:
  # cron expression, to switch off put value '-'
  task-cleaner-schedule: 0 0 1 * * ?
  # delete logs from db that older than X days
  clean-period: 1080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  cef:
    path: logs
    fileName: cef.log
    retention-days: 90
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl: DEBUG
    org.apache.flink: INFO
    org.springframework.jdbc: WARN
    com.gpb.replication.postgres: DEBUG
  config: file:${APP_PATH}/config/logback-spring.xml