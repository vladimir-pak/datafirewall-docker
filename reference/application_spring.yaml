server:
  port: 9200
  tomcat:
    max-connections: 100 # Максимальное количество соединений
    accept-count: 100 # Максимальное количество потоков
    threads:
      max: 50 # Размер очереди запросов

spring:
  application:
    name: datafirewall-spring
    version: ${APP_VERSION}
    project-name: MKD

  datasource:
    url: ${DATASOURCE_DB_URL:localhost:5432}
    username: ${DATASOURCE_DB_USER:postgres}
    password: ${DATASOURCE_DB_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: datafirewall

  kafka:
    cache-update:
      enabled: true # toggle kafka service
    topics:
      cache-update: rules-update

    bootstrap-servers:
      - localhost:9092

    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME:kafka}"
        password="${KAFKA_PASSWORD:kafka}";

    # properties:
    #   security.protocol: PLAINTEXT
      # sasl.mechanism: SCRAM-SHA-512
      # sasl.jaas.config: >
      #   org.apache.kafka.common.security.scram.ScramLoginModule required
      #   username="${KAFKA_USERNAME}"
      #   password="${KAFKA_PASSWORD}";

      # ssl.truststore.location: ${APP_PATH}/certs/truststore.p12
      # ssl.truststore.password: ${TRUST_STORE_PASSWORD}
      # ssl.truststore.type: PKCS12

      # ssl.keystore.location: ${APP_PATH}/certs/keystore.p12
      # ssl.keystore.password: ${KEY_STORE_PASSWORD}
      # ssl.keystore.type: PKCS12

    producer:
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      acks: all
      request-timeout-ms: 30000
      delivery-timeout-ms: 120000

  flyway:
    schemas: datafirewall
    enabled: false
    locations: classpath:db/migration
    url: ${FLYWAY_DB_URL:localhost:5432}
    user: ${FLYWAY_DB_USER:postgres}
    password: ${FLYWAY_DB_PASSWORD:postgres}

jwt:
  secret: ${JWT_SECRET:nQ1O6UXZox/Qm4NdCAjrdO3a5evCyUr6IbeB31L/BPQ=}
  expirationHours: 87600

ignite:
  thin:
    addresses:
      - localhost:10800

    connect-timeout-ms: 5000
    ssl-enabled: false
    username: ${IGNITE_USER:ignite}
    password: ${IGNITE_PASSWORD:ignite}

  # ssl:
  #   key-store-path: ${APP_PATH}/certs/keystore.p12
  #   key-store-password: ${KEY_STORE_PASSWORD}
  #   trust-store-path: ${APP_PATH}/certs/truststore.p12
  #   trust-store-password: ${TRUST_STORE_PASSWORD}

logs-database:
  enabled: true
  task-create-partition: 0 0 0 * * ?
  url: ${LOGS_DB_URL:localhost:5432}
  username: ${LOGS_DB_USER:postgres}
  password: ${LOGS_DB_PASSWORD:postgres}
  driverClassName: org.postgresql.Driver
  table: "dq_audit.datafirewall_spring_log"

clean-database-logs:
  # cron expression, to switch off put value '-'
  task-cleaner-schedule: 0 0 * * * ?
  # delete logs from db that older than X days
  clean-period: 1080

datafirewall:
  generated-rules:
    enabled: false
    output-dir: ./generated-rules

sync:
  enabled: true
  interval: 60000
  timeout-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  cef:
    path: ${APP_PATH}/logs
    fileName: cef.log
    retention-days: 90
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl: DEBUG
    org.apache.flink: INFO
    org.springframework.jdbc: WARN
    com.gpb.replication.postgres: DEBUG
    org.flywaydb: DEBUG
  config: file:${APP_PATH}/config/logback-spring.xml